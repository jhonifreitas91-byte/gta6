<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chance de ganhar um PS5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root { --pink:#f02bc4; --purple:#7824cb; --cyan:#00d9ee; --white:#fff; }
    body {
      margin:0; min-height:100svh; color:var(--white); font-family:'Barlow Condensed',sans-serif;
      background: #190d2c url('IMG_5952.webp') center center / cover fixed no-repeat;
      display:flex; align-items:center; justify-content:center; padding:24px 16px;
    }
    body::before {
      content:''; position:fixed; inset:0; z-index:0;
      background:linear-gradient(180deg,rgba(13,5,31,.45),rgba(23,4,39,.82));
    }
    .container { width:min(100%,680px); position:relative; z-index:1; }
    .card {
      border:2px solid transparent; border-radius:28px; padding:34px 26px 30px;
      background:linear-gradient(145deg,rgba(43,12,67,.94),rgba(65,15,75,.91)) padding-box,
                 linear-gradient(135deg,var(--pink),#7a37e5,var(--cyan)) border-box;
      box-shadow:0 0 28px rgba(226,30,202,.18), inset 0 0 25px rgba(255,255,255,.025);
      text-align:center; backdrop-filter: blur(5px);
    }
    .stars { color:var(--pink); font-size:clamp(24px,6vw,38px); letter-spacing:9px; margin:0 0 12px; text-shadow:0 0 16px rgba(240,43,196,.35); }
    h1 { margin:0 auto 22px; font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
      font-size:clamp(38px,9vw,68px); line-height:1.02; letter-spacing:.3px; text-shadow:4px 4px 0 #a12ae1; }
    h1 .highlight { color:#ff45d0; }
    .copy { margin:0 auto; max-width:560px; font-size:clamp(22px,5.4vw,31px); font-weight:700; line-height:1.22; }
    .copy p { margin:0 0 14px; }
    .copy .cyan { color:var(--cyan); }
    .copy .pink { color:#ff48d1; }
    .divider { height:1px; margin:25px 0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent); }
    .cta { display:inline-block; width:min(100%,470px); padding:18px 20px; border:2px solid #ff55d1; border-radius:16px;
      background:linear-gradient(100deg,#e52bc2,#8b28d7); color:#fff; font-family:'Anton',sans-serif; font-size:clamp(23px,6vw,34px);
      text-decoration:none; letter-spacing:.7px; box-shadow:0 7px 0 #501a80,0 0 24px rgba(227,35,199,.35); transition:transform .15s,filter .15s; }
    .cta:hover { transform:translateY(-2px); filter:brightness(1.12); }
    .cta:active { transform:translateY(3px); box-shadow:0 3px 0 #501a80; }
    .note { margin-top:18px; color:#d9c7ed; font-size:15px; letter-spacing:.5px; }
    @media(max-width:420px){ .card{padding:28px 18px 24px;border-radius:22px;} .stars{letter-spacing:5px;} }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="stars" aria-label="seis estrelas">★ ★ ★ ★ ★ ★</div>
      <h1>Quer ter <span class="highlight">20x mais chance</span><br>de ganhar o PS5?</h1>
      <div class="divider"></div>
      <div class="copy">
        <p>Abaixo temos um <span class="pink">cupom</span> que garante mais de <span class="cyan">65% de chance</span> de ganhar!</p>
        <p>Passe na frente de todos e <span class="pink">garanta já o seu!</span></p>
      </div>
      <div class="divider"></div>
      <a class="cta" href="#" onclick="return false;">ADQUIRIR AGORA</a>
    </section>
  </main>
</body>
</html>
